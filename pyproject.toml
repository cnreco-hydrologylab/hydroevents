[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroevents"
version = "0.1.2"
description = "Python tools for streamflow preprocessing, recession analysis, baseflow separation, and rainfall–runoff event identification."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE.txt" }

authors = [
  { name = "Sofia Ortenzi" },
  { name = "Christian Massari" },
  { name = "Martina Natali" },
  { name = "Marco Dionigi" },
  { name = "Lucio Di Matteo" }
]

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "plotly",
  "openpyxl"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
