[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroevents"
version = "0.1.2"
description = "Python tools for streamflow preprocessing, recession analysis, baseflow separation, and rainfall–runoff event identification."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE.txt" }

authors = [
  { name = "Sofia Ortenzi" },
  { name = "Christian Massari" },
  { name = "Martina Natali" },
  { name = "Marco Dionigi" },
  { name = "Lucio Di Matteo" }
]

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "plotly",
  "openpyxl"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.bumpversion]
current_version = "0.1.2"
allow_dirty = false
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = 'version: "{current_version}"'
replace = 'version: "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = 'date-released: "[^"]*"'
replace = 'date-released: "{now:%Y-%m-%d}"'
regex = true
